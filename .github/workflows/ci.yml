name: ShoppingCart CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-and-coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests -p "test_*.py"

      - name: Check coverage threshold
        run: python -m coverage report -m --fail-under=80

      - name: Generate HTML coverage report
        run: python -m coverage html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/

      - name: Send Discord notification on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"GitHub Actions failed for ShoppingCart CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "$DISCORD_WEBHOOK_URL"

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    needs: test-and-coverage
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run mutation testing
        run: python scripts/mutation_report.py --suite full | tee mutation-results.txt

      - name: Upload mutation testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-results
          path: mutation-results.txt
